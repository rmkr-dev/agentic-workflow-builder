name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Secret scan (basic)
        run: |
          if grep -RInE 'sk-[A-Za-z0-9]{20,}|api[_-]?key\s*=\s*['\''\"][^'\''\"]+['\''\"]' \
            --exclude-dir=.git --exclude-dir=.venv --exclude='*.md' . ; then
            echo "Possible secrets found"; exit 1;
          fi
          echo "secret scan clean"
      - name: Tests
        env:
          AGENTFORGE_LLM_MOCK: "1"
        run: pytest -q
      - name: Doctor
        run: agentforge doctor --full
      - name: Validate examples
        run: |
          for f in examples/*/workflow.yaml; do
            agentforge validate "$f"
          done
