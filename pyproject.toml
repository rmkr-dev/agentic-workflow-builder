[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agentforge"
version = "0.1.0"
description = "Compile agentic intent into executable workflows."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "AgentForge Contributors" }]
keywords = ["agents", "workflows", "langgraph", "compiler", "codegen"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Code Generators",
]
dependencies = [
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "typer>=0.12,<1",
  "rich>=13.7,<15",
  "jinja2>=3.1,<4",
  "pyyaml>=6.0,<7",
  "httpx>=0.27,<1",
  "jsonschema>=4.22,<5",
  "networkx>=3.3,<4",
  "langgraph>=0.2,<1",
  "langchain-core>=0.3,<1",
]

[project.optional-dependencies]
microsoft = ["agent-framework>=1.0.0b1"]
dev = [
  "pytest>=8.2,<9",
  "pytest-cov>=5.0,<7",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
  "types-PyYAML>=6.0",
]
all = ["agentforge[microsoft,dev]"]

[project.scripts]
agentforge = "agentforge.cli.app:main"

[project.urls]
Homepage = "https://github.com/agentforge/agentforge"
Documentation = "https://github.com/agentforge/agentforge/tree/main/docs"
Issues = "https://github.com/agentforge/agentforge/issues"

[tool.hatch.build.targets.wheel]
packages = ["agentforge"]

[tool.hatch.build.targets.sdist]
include = [
  "/agentforge",
  "/templates",
  "/examples",
  "/docs",
  "/tests",
  "/scripts",
  "/README.md",
  "/LICENSE",
  "/CHANGELOG.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --tb=short"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true
